<style>
/* Layout: one handheld body centred on a dark desk — LCD, round replay pad inside a 6-column function block, 5-column number block */
:root{
  --desk:#0f1217; --desk2:#1b2029;
  --body:#36383e; --body2:#2b2d32; --rim:#45484f;
  --lcd:#c6cfbc; --lcd2:#b4bea9; --ink:#1c251b; --faint:rgba(28,37,27,.32);
  --kfn:#383b42; --kfn-hi:#4a4d55; --kfn-t:#f4f5f7;
  --knum:#141517; --knum-hi:#2a2b2e; --knum-t:#ffffff;
  --kyel:#ebc616; --kyel-hi:#f8dc35; --kyel-t:#141414;
  --lshift:#e3c94a; --lalpha:#e6589c; --lbase:#3f8fe3; --lwhite:#e9eaec;
  --muted:#8b95a3; --text:#d9dee6;
  --f-lcd:'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace;
  --f-key:'Barlow', system-ui, -apple-system, sans-serif;
  --f-lab:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --kh:clamp(24px,3.9dvh,32px); --nh:clamp(30px,5dvh,42px); --lh:clamp(128px,20dvh,172px);
  color-scheme:dark;
}
html,body{background:var(--desk)}
body{background:radial-gradient(120% 70% at 50% 0%,var(--desk2),var(--desk));color:var(--text);font-family:var(--f-key);min-height:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
.calc{width:100%;max-width:400px;background:linear-gradient(180deg,var(--body),var(--body2));border-radius:28px 28px 36px 36px;padding:13px 13px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px var(--rim),0 24px 50px rgba(0,0,0,.55)}
.brand{display:flex;justify-content:center;align-items:center;padding:0 6px 8px}
.wm{font:700 15px/1 var(--f-key);letter-spacing:.26em;color:#e3e7ec}
.wm span{margin-left:8px;font-weight:500;letter-spacing:.06em;color:var(--muted)}
.solar{display:flex;gap:2px;background:#26211b;padding:3px;border-radius:4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.solar i{width:15px;height:11px;background:linear-gradient(160deg,#4d3d2f,#2a2119);border-radius:1px}
.bezel{background:#14181e;border-radius:12px;padding:9px;box-shadow:inset 0 2px 6px rgba(0,0,0,.65)}
.lcd{background:linear-gradient(180deg,var(--lcd),var(--lcd2));color:var(--ink);border-radius:4px;height:var(--lh);display:flex;flex-direction:column;padding:3px 8px 5px;font-family:var(--f-lcd);box-shadow:inset 0 2px 4px rgba(0,0,0,.25);overflow:hidden}
.st{height:17px;min-height:17px;flex:none;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;border-bottom:1px solid var(--faint);margin:0 -2px 3px;padding:0 2px 1px}
.st .ar{letter-spacing:-.1em;font-size:10px}
.st .ang{background:var(--ink);color:var(--lcd);font-size:12px;line-height:13px;padding:0 3px;border-radius:2px;min-width:9px;text-align:center}
.st .bx{border:1px solid var(--ink);padding:0 2px;line-height:10px;font-size:10px}
.st .si{background:var(--ink);color:var(--lcd);padding:0 2px;line-height:11px;font-weight:normal}
.st .sp{flex:1}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.in{font-size:20px;line-height:1.35;word-break:break-all;overflow:hidden;max-height:4.05em;position:relative;flex:none}
.out{margin-top:auto;text-align:right;font-size:30px;line-height:1.15;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:none;padding-top:2px}
.out::-webkit-scrollbar{display:none}
.out.bin{font-size:17px;white-space:normal;word-spacing:-.15em}
.out.two{font-size:21px;line-height:1.25}
.out .lr{font-size:14px}
.note{font-size:.85em}
.cur{display:inline-block;width:2px;height:1.05em;background:var(--ink);vertical-align:-.15em;margin:0 -1px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.7em;line-height:1.08;margin:0 .1em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.rad{white-space:nowrap}.rad>span{border-top:2px solid currentColor;padding-left:.06em}
.x10{font-size:.8em}sup{font-size:.62em;line-height:0}
.ii{font-style:italic}
.err{display:flex;flex-direction:column;justify-content:center;height:100%;gap:2px;font-size:15px;padding-left:4px}
.err .et{font-size:22px;margin-bottom:6px}
.lt{font-size:12px;border-bottom:1px solid var(--faint);padding-bottom:1px;margin-bottom:2px;flex:none;white-space:nowrap;overflow:hidden}
.ll{overflow:hidden;flex:1;min-height:0;position:relative}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;padding:2px 4px;flex-wrap:wrap;line-height:1.3}
.li.on{background:var(--ink);color:var(--lcd)}
.lv{margin-left:auto;text-align:right}
.pr{font-size:18px;padding:8px 4px}
.hint{font-size:11px;margin-top:auto;opacity:.75}
.mg{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:3px;flex:1;padding-top:2px}
.mi{border:1.5px solid var(--ink);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;position:relative;gap:1px;min-width:0;overflow:hidden;white-space:nowrap}
.mi b{font-size:15px;font-weight:normal}
.mi .mn{position:absolute;left:3px;top:1px;font-size:9px}
.mi.x{border-style:dashed}
.mi.on{background:var(--ink);color:var(--lcd)}
.gt{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed;flex:none}
.gt th{font-weight:normal;border-bottom:1px solid var(--ink);padding:0 3px;text-align:center}
.gt td{border:1px solid var(--faint);text-align:right;padding:1px 3px;overflow:hidden;white-space:nowrap;line-height:1.25}
.gt td.on{background:var(--ink);color:var(--lcd)}
.gt .rn{width:1.8em;text-align:left;border-left:0;font-size:12px}
.gt .rn.w{width:3.6em}
.gbar{margin-top:auto;border-top:1px solid var(--ink);font-size:19px;text-align:right;min-height:27px;padding-top:2px;overflow:hidden;white-space:nowrap;flex:none}
.gbar .gm{font-size:14px}
.st5{font-size:12px}.st5 td{padding:1px 2px}
.gt td.grab,.gt td.src{outline:2px dashed var(--ink);outline-offset:-3px}
.cref{float:left;font-size:11px;margin-top:6px;margin-right:6px}
.lcd.small .in{font-size:16px}.lcd.small .out{font-size:24px}
.gin{word-break:break-all;white-space:normal}
.fl{font-size:18px;line-height:1.35;word-break:break-all;opacity:.5}
.fl.on{opacity:1}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:14px;padding-top:3px}
.rg div{display:flex;justify-content:space-between;gap:4px}
.keys{display:grid;gap:5px 7px;margin-top:12px}
.keys.fn{grid-template-columns:repeat(6,minmax(0,1fr))}
.keys.num{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px 10px;margin-top:13px}
.kc{display:flex;flex-direction:column;gap:2px;min-width:0}
.lab{display:flex;justify-content:center;gap:6px;font:600 10px/11px var(--f-lab);height:11px;padding:0 1px;white-space:nowrap;letter-spacing:.01em}
.lab sup,.lab sub{font-size:.75em;line-height:0}
.ls{color:var(--lshift)}.la{color:var(--lalpha)}.lb{color:var(--lbase)}
.k{appearance:none;border:0;border-radius:8px 8px 10px 10px;height:var(--kh);font:600 14px var(--f-key);color:var(--kfn-t);background:linear-gradient(180deg,var(--kfn-hi),var(--kfn));box-shadow:0 2px 0 #11151a,inset 0 1px 0 rgba(255,255,255,.12);cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;min-width:0}
.k sup{font-size:.62em;line-height:0;position:relative;top:-.15em}
.k sub{font-size:.62em;line-height:0;position:relative;top:.15em}
.bx{display:inline-block;width:.5em;height:.58em;border:1.5px solid currentColor;box-sizing:border-box;border-radius:1px;vertical-align:-.05em;margin:0 .04em}
.bx.f{background:currentColor}
sup .bx,sub .bx{width:.75em;height:.85em;border-width:1.2px}
.lab .bx{width:5px;height:6px;border-width:1px;vertical-align:0}
.lab sup .bx,.lab sub .bx{width:6px;height:7px}
.stk{display:inline-flex;flex-direction:column;align-items:center;gap:1px;vertical-align:middle;line-height:0}
.stk>i{display:block;width:.85em;height:1.5px;background:currentColor}
.lab .stk>i{width:7px;height:1px}
.lab .stk{gap:1px}.lab .stk .bx{width:5px;height:4px}
.bxs{display:inline-block;width:max(.55em,10px);height:max(.72em,13px);border:2px dashed currentColor;background:rgba(28,37,27,.13);box-sizing:border-box;border-radius:1px;vertical-align:-.1em;margin:0 .08em}
.ex{font-size:.68em;vertical-align:.8em;line-height:1}
.in .fr,.gin .fr,.fl .fr,.vin .fr{font-size:.8em}
.rt{white-space:nowrap}.rt>.v{border-top:1.5px solid currentColor;padding:1px 1px 0;margin-left:-.05em}
.lim{display:inline-flex;flex-direction:column;gap:2px;vertical-align:middle;line-height:0;margin:0 .08em 0 -.05em}
.lim .bx{width:.42em;height:.46em;border-width:1.2px}
.k:active{transform:translateY(2px);box-shadow:0 0 0 #11151a,inset 0 1px 0 rgba(255,255,255,.08)}
.k:focus-visible,.pad button:focus-visible{outline:2px solid var(--lshift);outline-offset:2px}
.k.ksm{font-size:11.5px;letter-spacing:.04em}
.k.kshift{color:var(--lshift);font-size:11.5px;letter-spacing:.04em}
.k.kalpha{color:var(--lalpha);font-size:11.5px;letter-spacing:.04em}
.k.kon{font-size:11.5px;letter-spacing:.04em;border-radius:12px}
.pad{grid-column:3/5;grid-row:1/3;align-self:center;width:100%;height:calc(2*var(--kh) + 26px);border-radius:44%/50%;background:#141518;position:relative;box-shadow:0 2px 0 #08090a,0 0 0 2px #26282c}
.pad button{position:absolute;inset:3px;appearance:none;border:0;padding:0;border-radius:44%/50%;background:linear-gradient(180deg,#43464d,#2b2d32);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pad button:active{background:linear-gradient(180deg,#5a5e66,#3c3f45)}
.pad .pu{clip-path:polygon(4% 0,96% 0,64% 33%,36% 33%)}
.pad .pd{clip-path:polygon(36% 67%,64% 67%,96% 100%,4% 100%)}
.pad .pl{clip-path:polygon(0 4%,30% 36%,30% 64%,0 96%)}
.pad .pr2{clip-path:polygon(100% 4%,100% 96%,70% 64%,70% 36%)}
.num .k{height:var(--nh);font-size:24px;font-weight:600;color:var(--knum-t);background:linear-gradient(180deg,var(--knum-hi),var(--knum));box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.1)}
.num .k:active{box-shadow:0 0 0 #050506}
.num .k.ksm{font-size:15px}
.num .k.kyel{background:linear-gradient(180deg,var(--kyel-hi),var(--kyel));color:var(--kyel-t);box-shadow:0 2px 0 #7a6306,inset 0 1px 0 rgba(255,255,255,.35);font-size:19px;font-weight:700;letter-spacing:.02em}
.lab.ctr{justify-content:center;gap:5px}
.lw{color:var(--lwhite)}
.hx{display:inline-block;color:var(--lalpha);border:1px solid var(--lbase);border-bottom:0;padding:0 2px;line-height:9px;margin-top:1px}
.k{font-weight:700}
.k.kround{width:calc(var(--kh) + 6px);height:calc(var(--kh) + 6px);border-radius:50%;align-self:center;background:radial-gradient(circle at 50% 35%,#3c3e44,#1b1c1f);box-shadow:0 2px 0 #0a0b0c,inset 0 1px 0 rgba(255,255,255,.1)}
.k i,.lab i{font-family:'Noto Serif',Georgia,'Times New Roman',serif;font-style:italic;font-weight:600}
body.sh .ls{text-shadow:0 0 6px rgba(239,181,74,.7)}
body.sh #k-shift{box-shadow:0 0 0 2px var(--lshift),0 2px 0 #11151a}
body.al .la{text-shadow:0 0 6px rgba(242,132,154,.7)}
body.al #k-alpha{box-shadow:0 0 0 2px var(--lalpha),0 2px 0 #11151a}
.foot{max-width:400px;width:100%;font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}
.foot b{color:var(--text);font-weight:600}
/* Fit-to-screen: the calculator fills the viewport height and scales its parts */
html{box-sizing:border-box;height:100%}
body{height:100%;min-height:0}
.wrap{height:100%;box-sizing:border-box;padding-block:8px;gap:0;justify-content:center}
.calc{flex:1 1 auto;min-height:520px;max-height:1000px;max-width:min(560px,calc((100dvh - 16px) * .54));box-sizing:border-box;display:flex;flex-direction:column;container-type:size;padding:3% 3% 4%}
.bezel{flex:none}
.lcd{height:clamp(116px,22cqh,250px)}
.in{font-size:clamp(18px,5.4cqw,27px)}
.out{font-size:clamp(26px,8.4cqw,42px)}
.keys{flex:1 1 0;min-height:0;container-type:size;margin-top:2.2cqh}
.keys.fn{flex-grow:5;grid-template-rows:repeat(5,minmax(0,1fr));row-gap:6px;column-gap:3cqw;
  --lb:clamp(9px,2.7cqw,12.5px);--rs:min(calc((100cqh - 24px)/5 - 1.15*var(--lb) - 3px),calc(100cqw/6 - 6px))}
.keys.num{flex-grow:4.7;grid-template-rows:repeat(4,minmax(0,1fr));row-gap:8px;column-gap:3.4cqw;--lb:clamp(9px,2.7cqw,12.5px)}
.kc{min-height:0}
.lab{font-size:var(--lb);line-height:1.15;height:calc(1.15*var(--lb));flex:none}
.lab .bx{width:.5em;height:.6em}
.k{height:auto;flex:1 1 auto;min-height:0;font-size:clamp(12px,3.6cqw,18px)}
.k.ksm{font-size:clamp(10.5px,3cqw,16px)}
.k.kround{flex:none;width:var(--rs);height:var(--rs)}
.pad{align-self:stretch;height:auto;margin-top:calc(1.15*var(--lb) + 2px)}
.num .k{height:auto;font-size:clamp(20px,7.2cqw,34px)}
.num .k.ksm{font-size:clamp(14px,4.6cqw,24px)}
.num .k.kyel{font-size:clamp(16px,5.4cqw,27px)}
.lcd.small .in{font-size:clamp(15px,4.4cqw,22px)}.lcd.small .out{font-size:clamp(22px,7cqw,34px)}
</style>

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font-size:14px;overscroll-behavior:none;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{max-width:100%}[hidden]{display:none!important}
.wrap{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
</style>
</head>
<body>
<main class="wrap">
  <div class="calc" role="application" aria-label="Scientific calculator">
    <div class="bezel"><div class="lcd"><div class="st" id="st"></div><div class="scr" id="scr" aria-live="polite"></div></div></div>
    <div class="keys fn" id="kfn"></div>
    <div class="keys num" id="knum"></div>
  </div>
</main>

<script>
(function(){
'use strict';
/* ---------- state ---------- */
const C=(re,im=0)=>({re,im});
const VARN=['A','B','C','D','E','F','M','x','y'];
const ned=()=>({tokens:[],cur:0});
const S={mode:'calc',view:'main',ret:'main',shift:false,alpha:false,pend:null,angle:'D',fmt:{t:'norm',n:1},polar:false,base:10,
  vars:{},ans:C(0),ed:ned(),res:null,undo:null,hist:[],hi:-1,menuSel:0,setupPage:'root',optn:null,pick:null,grid:null,list:null,line:null,tv:null,vp:null,
  tbl:{f:ned(),g:ned(),range:[[1],[5],[1]]},eqn:{saved:{}},stat:{type:'1v',rows:[]},sh:null,fill:null,setupSel:0,insPend:false};
const newSheet=()=>({cells:{},sel:[0,0],top:0,buf:null,mode:null,clip:null,g:null,msg:null,confirm:false});
S.sh=newSheet();
const DEF={io:'MM',angle:'D',fmt:{t:'norm',n:1},fracRes:'dc',polar:false,freq:false,autoCalc:true,showCell:'formula',eqCplx:true,decMark:'.',sep:false,smallFont:false,qr:11,contrast:0};
const SETK=Object.keys(DEF);
function resetSetup(){SETK.forEach(k=>{S[k]=JSON.parse(JSON.stringify(DEF[k]));});}
resetSetup();
VARN.forEach(v=>S.vars[v]=C(0));
const LS='orbit-sc97';
function save(){try{const set={};SETK.forEach(k=>{set[k]=S[k];});localStorage.setItem(LS,JSON.stringify({vars:S.vars,ans:S.ans,set}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(!d)return;
  if(d.vars)VARN.forEach(v=>{if(d.vars[v])S.vars[v]=C(+d.vars[v].re||0,+d.vars[v].im||0);});
  if(d.ans)S.ans=C(+d.ans.re||0,+d.ans.im||0);if(/^[DRG]$/.test(d.angle))S.angle=d.angle;if(d.fmt&&d.fmt.t)S.fmt=d.fmt;S.polar=!!d.polar;if(d.set)SETK.forEach(k=>{if(d.set[k]!==undefined)S[k]=d.set[k];});}catch(e){}}

/* ---------- errors & complex arithmetic ---------- */
function ME(){return new Error('Math ERROR');}
function SEr(pos){const e=new Error('Syntax ERROR');e.pos=pos;return e;}
const snap=(v,a,b)=>Math.abs(v)<=1e-14*Math.max(Math.abs(a),Math.abs(b))?0:v;
const cadd=(a,b)=>C(snap(a.re+b.re,a.re,b.re),snap(a.im+b.im,a.im,b.im));
const csub=(a,b)=>C(snap(a.re-b.re,a.re,b.re),snap(a.im-b.im,a.im,b.im));
const cmul=(a,b)=>C(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);
function cdiv(a,b){const d=b.re*b.re+b.im*b.im;if(d===0)throw ME();if(b.im===0)return C(a.re/b.re,a.im/b.re);return C((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d);}
const cneg=a=>C(-a.re,-a.im);
const isR=z=>Math.abs(z.im)<=1e-13*Math.max(1,Math.abs(z.re));
function R(z){if(!isR(z))throw ME();return z.re;}
function sr(x){if(!Number.isFinite(x))throw ME();return x===0?0:Number(x.toPrecision(15));}
const sr12=x=>{if(!Number.isFinite(x))throw ME();const v=x===0?0:Number(x.toPrecision(12));return v===0?0:v;};
function chkInt(v){const r=sr(v);if(!Number.isInteger(r))throw ME();return r;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function csqrt(z){
  if(isR(z)){const x=z.re;if(x>=0)return C(Math.sqrt(x));if(S.mode!=='cmplx')throw ME();return C(0,Math.sqrt(-x));}
  if(S.mode!=='cmplx')throw ME();
  const m=Math.hypot(z.re,z.im);return C(Math.sqrt((m+z.re)/2),Math.sign(z.im)*Math.sqrt((m-z.re)/2));
}
const toRad=x=>S.angle==='D'?x*Math.PI/180:S.angle==='G'?x*Math.PI/200:x;
const fromRad=x=>S.angle==='D'?x*180/Math.PI:S.angle==='G'?x*200/Math.PI:x;
const quarter=()=>S.angle==='D'?90:S.angle==='G'?100:Math.PI/2;
function trig(f,x){
  const k=x/quarter(),kr=Math.round(k);
  if(Math.abs(k-kr)<=1e-12*Math.max(1,Math.abs(k))){const m=((kr%4)+4)%4;

function solveLin(M0){
  const n=M0.length,A=M0.map(r=>r.slice());let sc=0;A.forEach(r=>r.forEach(v=>{sc=Math.max(sc,Math.abs(v));}));const eps=1e-11*(sc||1);
  let row=0;
  for(let c=0;c<n;c++){if(row>=n)break;let best=row;for(let r=row;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[best][c]))best=r;
    if(Math.abs(A[best][c])<eps)continue;
    [A[row],A[best]]=[A[best],A[row]];const pv=A[row][c];for(let k=c;k<=n;k++)A[row][k]/=pv;
    for(let r=0;r<n;r++)if(r!==row){const f=A[r][c];if(f)for(let k=c;k<=n;k++)A[r][k]-=f*A[row][k];}
    row++;}
  for(let r=row;r<n;r++)if(Math.abs(A[r][n])>eps)return'none';
  if(row<n)return'inf';
  return A.map(r=>r[n]);}
function divisors(n){n=Math.abs(n);const d=[];for(let i=1;i*i<=n;i++)if(n%i===0){d.push(i);if(i*i!==n)d.push(n/i);}return d;}
function divLin(a,p,q){const n=a.length,b=[];b[0]=a[0]/q;
  for(let i=1;i<n-1;i++)b[i]=(a[i]+p*b[i-1])/q;
  const rem=a[n-1]+p*b[n-2];if(rem!==0||!b.every(Number.isInteger))return null;return b;}
function quadRoots(a,b,c){
  const D0=b*b-4*a*c,D=Math.abs(D0)<=1e-12*Math.max(b*b,Math.abs(4*a*c))?0:D0,p=-b/(2*a);
  if(D===0)return[{re:sr12(p),im:0}];
  const s=Math.sqrt(Math.abs(D))/(2*Math.abs(a)),ps=sr12(p),ss=sr12(s);
  const pe=ps===0?'':exactHTML(ps),se=exactHTML(ss),ok=pe!==null&&se!==null;
  if(D>0)return[[p+s,'+'],[p-s,'−']].map(([v,sg])=>{const vv=sr12(v);let h=exactHTML(vv);
    if(h===null&&ok)h=pe?pe+sg+se:(sg==='−'?'−':'')+se;return{re:vv,im:0,h};});
  return['+','−'].map(sg=>({re:ps,im:sg==='+'?ss:-ss,h:ok?(pe?pe+sg:(sg==='−'?'−':''))+(ss===1?'':se)+iH:null}));
}
function dk(a){const n=a.length-1,m=a.map(v=>v/a[0]);const R0=1+Math.max(...m.slice(1).map(Math.abs));
  const z=[];for(let k=0;k<n;k++){const t=2*Math.PI*k/n+0.4;z.push(C(R0*.6*Math.cos(t),R0*.6*Math.sin(t)));}
  const mulp=(x,y)=>C(x.re*y.re-x.im*y.im,x.re*y.im+x.im*y.re);
  for(let it=0;it<2000;it++){let mx=0;
    for(let i=0;i<n;i++){let p=C(m[0]);for(let k=1;k<=n;k++){p=mulp(p,z[i]);p=C(p.re+m[k],p.im);}
      let den=C(1);for(let j=0;j<n;j++)if(j!==i)den=mulp(den,C(z[i].re-z[j].re,z[i].im-z[j].im));
      const dd=den.re*den.re+den.im*den.im;if(dd===0){z[i]=C(z[i].re+1e-6,z[i].im+1e-6);mx=1;continue;}
      const d=C((p.re*den.re+p.im*den.im)/dd,(p.im*den.re-p.re*den.im)/dd);
      z[i]=C(z[i].re-d.re,z[i].im-d.im);mx=Math.max(mx,Math.hypot(d.re,d.im));}
    if(mx<1e-15)break;}
  return z.map(w=>{let re=w.re;const im=Math.abs(w.im)<1e-9*Math.max(1,Math.abs(w.re))?0:w.im;
    if(im===0){for(let k=0;k<20;k++){let p=0,dp=0;for(let j=0;j<=n;j++){dp=dp*re+p;p=p*re+m[j];}if(!dp)break;const st=p/dp;re-=st;if(Math.abs(st)<1e-16*Math.max(1,Math.abs(re)))break;}}
    return{re,im};});}
function polySolve(c){
  let a=c.slice();const roots=[];
  while(a.length>1&&a[a.length-1]===0){roots.push({re:0,im:0});a.pop();}
  if(a.every(v=>Number.isInteger(v)&&Math.abs(v)<=1e7)){
    let found=true;
    while(a.length>3&&found){found=false;
      const cs=[];divisors(a[a.length-1]).forEach(p=>divisors(a[0]).forEach(q=>{cs.push([p,q],[-p,q]);}));
      for(const [p,q] of cs){const b=divLin(a,p,q);if(b){roots.push({re:p/q,im:0});a=b;found=true;break;}}}
  }
  if(a.length===3)roots.push(...quadRoots(a[0],a[1],a[2]));
  else if(a.length===2)roots.push({re:-a[1]/a[0],im:0});
  else if(a.length>3)roots.push(...dk(a));
  const out=[];
  roots.map(z=>({re:sr12(z.re),im:sr12(z.im),h:z.h})).forEach(z=>{if(!out.some(o=>Math.abs(o.re-z.re)<1e-9*Math.max(1,Math.abs(z.re))&&Math.abs(o.im-z.im)<1e-9*Math.max(1,Math.abs(z.im))))out.push(z);});
  return out.sort((u,v)=>(u.im!==0)-(v.im!==0)||(u.im===0?v.re-u.re:v.im-u.im));
}
function solveEqn(){const g=S.grid;let lines;

      else lines=r.map((v,i)=>[`<i>${['x','y','z','t'][i]}</i>=`,realH(sr12(v),false)]);}
    else{const c=g.data[0];if(c[0]===0)throw ME();
      let roots=polySolve(c);if(!S.eqCplx)roots=roots.filter(z=>z.im===0);
      lines=!roots.length?[['No Real Roots','']]:roots.map((z,i)=>[roots.length===1?'<i>x</i>=':`<i>x</i><sub>${i+1}</sub>=`,z.h||abH(z.re,z.im,false)]);
      if(c.length===3){const [qa,qb,qc]=c,mm=qa>0?'Minimum':'Maximum';
        lines.push([`<i>x</i>-value ${mm}=`,realH(sr12(-qb/(2*qa)),false)],[`<i>y</i>-value ${mm}=`,realH(sr12(qc-qb*qb/(4*qa)),false)]);}}

function stData(){
  const rows=S.stat.rows,tw=two(),fi=S.freq?(tw?2:1):-1;

  rows.forEach(r=>{const x=r[0],y=tw?r[1]:0,f=fi>=0?(r[fi]==null?1:r[fi]):1;if(x==null||(tw&&y==null)||f<0)throw ME();if(f>0){d.xs.push(x);d.ys.push(y);d.fs.push(f);}});

function wsum(d,fn){let s=0;for(let k=0;k<d.xs.length;k++)s+=d.fs[k]*fn(d.xs[k],d.ys[k]);return s;}

    const s=solveLin(M);if(!Array.isArray(s))throw ME();return{a:s[0],b:s[1],c:s[2],r:null};}
  const pos=v=>{if(v<=0)throw ME();return Math.log(v);};

function statVar(name){

    case 'σ²x':return vx/n;case 'σx':return Math.sqrt(vx/n);case 's²x':need2();return vx/(n-1);case 'sx':need2();return Math.sqrt(vx/(n-1));

function estimate(k,v){
  if(!two())throw SEr(0);const f=regFit(stData()),t=S.stat.type,a=f.a,b=f.b,c=f.c;
  if(k==='ŷ'){switch(t){case 'lin':return a+b*v;case 'quad':return a+b*v+c*v*v;case 'log':if(v<=0)throw ME();return a+b*Math.log(v);case 'eexp':return a*Math.exp(b*v);case 'abx':return a*Math.pow(b,v);case 'pow':return a*Math.pow(v,b);case 'inv':if(v===0)throw ME();return a+b/v;}}

  const hasG=S.tbl.g.tokens.length>0,ev=(tk,x)=>{try{return R(finalize(evaluate(tk,{x:C(x)})));}catch(e){return null;}};
  const rows=[];for(let k=0;k<n;k++){const x=Number((st+k*sp).toPrecision(12));rows.push([x,ev(S.tbl.f.tokens,x),hasG?ev(S.tbl.g.tokens,x):null]);}

const COLS='ABCDE';
const ck=(c,r)=>COLS[c]+(r+1);
let SHEET={get:(c,r)=>{const cell=S.sh.cells[ck(c,r)];if(!cell)return 0;if(cell.v==null)throw new Error(cell.e||'Math ERROR');return cell.v;}};
function refTokens(c,r,ca,ra){const t=[];if(ca)t.push('$');t.push(COLS[c]);if(ra)t.push('$');String(r+1).split('').forEach(d=>t.push(d));return t;}
function shiftRefs(T,dr,dc){const out=[];let i=0;
  while(i<T.length){let j=i,ca=false,ra=false;if(T[j]==='$'){ca=true;j++;}
    if(/^[A-E]$/.test(T[j]||'')){const c0=T[j].charCodeAt(0)-65;let k=j+1;if(T[k]==='$'){ra=true;k++;}let d='';while(isDig(T[k]))d+=T[k++];
      if(d){const c=ca?c0:c0+dc,r=ra?(+d-1):(+d-1+dr);if(c<0||c>4||r<0||r>44)out.push('?');else out.push(...refTokens(c,r,ca,ra));i=k;continue;}}
    out.push(T[i]);i++;}
  return out;}
function cellBytes(){let b=0;Object.values(S.sh.cells).forEach(c=>{b+=c.f?11+c.tokens.length:10;});return b;}
function rangeFn(t,a1,a2){const c1=Math.min(a1.c,a2.c),c2=Math.max(a1.c,a2.c),r1=Math.min(a1.r,a2.r),r2=Math.max(a1.r,a2.r),vals=[];
  for(let c=c1;c<=c2;c++)for(let r=r1;r<=r2;r++){if(S.sh.cells[ck(c,r)])vals.push(SHEET.get(c,r));}
  if(t==='Sum(')return vals.reduce((s,v)=>s+v,0);
  if(!vals.length)throw ME();
  if(t==='Min(')return Math.min(...vals);if(t==='Max(')return Math.max(...vals);return vals.reduce((s,v)=>s+v,0)/vals.length;}
function recalcSheet(only){
  const cells=S.sh.cells,state={};
  const get=(c,r)=>{const k=ck(c,r),cell=cells[k];if(!cell)return 0;
    if(!cell.f){if(cell.v==null)throw new Error('Math ERROR');return cell.v;}
    if(state[k]==='done'){if(cell.e)throw new Error(cell.e);return cell.v;}
    if(state[k]==='visit')throw new Error('Circular ERROR');
    state[k]='visit';
    try{cell.v=R(finalize(evaluate(cell.tokens)));cell.e=null;}catch(e){cell.v=null;cell.e=/ERROR/.test(e.message)?e.message:'Math ERROR';}
    state[k]='done';if(cell.e)throw new Error(cell.e);return cell.v;};
  const prev=SHEET.get;SHEET.get=get;
  try{(only?[only]:Object.keys(cells)).forEach(k=>{const m=k.match(/^([A-E])(\d+)$/);try{get(m[1].charCodeAt(0)-65,+m[2]-1);}catch(e){}});}finally{SHEET.get=prev;}}

function setCellVal(L){const sh=S.sh,v=S.vars[L].re;sh.cells[ck(sh.sel[1],sh.sel[0])]={tokens:numTokens(v),f:false,v,e:null};if(S.autoCalc)recalcSheet();}
function sheetCommit(){
  const sh=S.sh,T=sh.buf.tokens;if(!T.length){sh.buf=null;return;}

function doPaste(){const sh=S.sh,cl=sh.clip,[r,c]=sh.sel,[fr,fc]=cl.from,cell=JSON.parse(JSON.stringify(cl.cell));

  if(S.autoCalc||cell.f)recalcSheet();}

function sheetKey(a){const sh=S.sh;sh.msg=null;
  if(sh.confirm){sh.confirm=false;if(a.cmd==='eq')sh.cells={};return;}
  const mv=(p,dr,dc)=>[Math.max(0,Math.min(44,p[0]+dr)),Math.max(0,Math.min(4,p[1]+dc))];

      case 'left':edLeft(sh.buf);break;case 'right':edRight(sh.buf);break;case 'up':vmove(sh.buf,-1);break;case 'down':vmove(sh.buf,1);break;}return;}
  if(D){sh.sel=mv(sh.sel,D[0],D[1]);return;}

function parseRange(T){const m=T.join('').match(/^([A-E])(\d+):([A-E])(\d+)$/);if(!m)return null;
  const a={c:m[1].charCodeAt(0)-65,r:+m[2]-1},b={c:m[3].charCodeAt(0)-65,r:+m[4]-1};if([a.r,b.r].some(r=>r<0||r>44))return null;

      if(F.kind==='formula')sh.cells[ck(c,r)]={tokens:tk,f:true,v:null,e:null};
      else sh.cells[ck(c,r)]={tokens:tk,f:false,v:R(finalize(evaluate(tk))),e:null};}}
  catch(e){sh.cells=JSON.parse(backup);F.msg=/ERROR/.test(e.message)?e.message:'Math ERROR';return;}
  if(cellBytes()>1700){sh.cells=JSON.parse(backup);F.msg='Memory ERROR';return;}
